<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noita Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed pannable map; a panel on the left with Found / Spells / Items / Materials / Run tabs (bottom sheet on phones). One dark look: it's a cave. */
:root {
  --bg: #0f0d14;
  --panel: #17141f;
  --panel-2: #201b2b;
  --line: #2e2739;
  --fg: #e9e4f2;
  --muted: #9a90ab;
  --gold: #e8b64c;      /* wands, rare */
  --card: #8fa3c8;      /* loose spell cards */
  --hit: #ff5fd2;       /* tracked */
  --new: #6fe0a0;       /* never picked up */
  --own: #7fd0ff;       /* in your inventory */
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px var(--body); overflow: hidden; }
[hidden] { display: none !important; }
.app { display: grid; grid-template-columns: 390px 1fr; height: 100%; }
aside {
  background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0; min-width: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; padding-block: 14px 0;
  gap: 10px;
}
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: .5px; margin: 0; line-height: 1; }
.sync { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.sync .btns { display: flex; gap: 4px; }
.btn { font: 600 12px var(--body); color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn[aria-pressed="true"] { border-color: var(--new); color: var(--new); }
.btn .led { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.btn[aria-pressed="true"] .led { background: var(--new); }
.btn.busy { opacity: .6; pointer-events: none; }
.status { font: 11px var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.status.err { color: #ff8a7a; }
.lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.tracking { display: flex; flex-direction: column; gap: 5px; }
.tchips { display: flex; flex-wrap: wrap; gap: 5px; min-height: 24px; align-items: center; }
.tchip { display: inline-flex; align-items: center; gap: 5px; font: 500 12.5px var(--body); color: var(--fg); background: rgba(255,95,210,.12); border: 1px solid rgba(255,95,210,.55); border-radius: 99px; padding: 2px 8px 2px 3px; cursor: pointer; }
.tchip img { width: 18px; height: 18px; image-rendering: pixelated; }
.tchip .sw { width: 14px; height: 14px; border-radius: 50%; margin-left: 2px; border: 1px solid rgba(255,255,255,.3); }
.tchip b { font-weight: 400; color: var(--muted); margin-left: 2px; }
.tchip:hover { background: rgba(255,95,210,.22); }
.hint { font-size: 12.5px; color: var(--muted); }
.tabs { display: flex; border-bottom: 1px solid var(--line); gap: 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { font: 600 13.5px var(--body); color: var(--muted); background: none; border: 0; padding: 8px 9px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--fg); border-color: var(--fg); }
.tab span { font: 500 11px var(--mono); color: var(--muted); margin-left: 3px; }
input#q {
  font: 500 14.5px var(--body); color: var(--fg); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 11px; width: 100%;
}
input#q:focus, select:focus { outline: 2px solid var(--hit); outline-offset: 1px; }
.controls { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chip { font: 500 12px var(--body); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 99px; padding: 4px 9px; cursor: pointer; }
.chip[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }
.chip.new[aria-pressed="true"] { background: var(--new); border-color: var(--new); }
.chip.rare[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); }
select { font: 500 12px var(--body); color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.chip:focus-visible, .row:focus-visible, button:focus-visible, .sp:focus-visible { outline: 2px solid var(--hit); outline-offset: 2px; }
.summary { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.summary b { color: var(--fg); font-weight: 600; }
.pane { overflow-y: auto; min-height: 0; flex: 1; padding-bottom: 16px; margin-right: -8px; padding-right: 8px; }
.list { display: flex; flex-direction: column; gap: 2px; }
.row { display: grid; grid-template-columns: 12px 1fr; gap: 10px; align-items: start; padding: 9px 8px; border-radius: 6px; cursor: pointer; border: 0; background: none; color: inherit; text-align: left; font: inherit; width: 100%; }
.row:hover, .row.sel { background: var(--panel-2); }
.dot { width: 9px; height: 9px; margin-top: 5px; transform: rotate(45deg); background: var(--gold); display: inline-block; }
.dot.card { background: var(--card); border-radius: 50%; transform: none; }
.dot.hit { background: var(--hit); box-shadow: 0 0 0 3px rgba(255,95,210,.25); }
.swatch { width: 12px; height: 12px; border-radius: 50%; margin-top: 3px; border: 1px solid rgba(255,255,255,.25); }
.rhead { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.rname { font-weight: 600; font-size: 13.5px; }
.tag { font: 600 10px var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.new { color: var(--new); border-color: rgba(111,224,160,.5); }
.tag.ns, .tag.rare { color: var(--gold); border-color: rgba(232,182,76,.5); }
.tag.rare { background: rgba(232,182,76,.12); }
.rmeta { font: 11.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.stats { display: grid; grid-template-columns: repeat(4, auto); justify-content: start; gap: 2px 12px; margin-top: 4px; font: 11.5px var(--mono); font-variant-numeric: tabular-nums; color: var(--fg); }
.stats span i { font-style: normal; color: var(--muted); margin-right: 4px; }
.icons { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 6px; align-items: center; }
.icons .ac { font: 600 10px var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 4px; }
.ic { position: relative; width: 20px; height: 20px; display: inline-grid; place-items: center; background: #0b0a10; border: 1px solid var(--line); border-radius: 3px; flex: none; }
.ic img { width: 16px; height: 16px; image-rendering: pixelated; }
.ic.r { border-color: rgba(232,182,76,.7); }
.ic.m { border-color: var(--hit); box-shadow: 0 0 0 1px var(--hit); }
.ic.n::after { content: ""; position: absolute; right: -2px; top: -2px; width: 6px; height: 6px; border-radius: 50%; background: var(--new); box-shadow: 0 0 0 1.5px var(--panel); }
.noicon { font: 10px var(--mono); color: var(--muted); }
/* a spell you are carrying: small light square at the bottom-left */
.ic.o::before, .sp.o::before { content: ""; position: absolute; left: 1px; bottom: 1px; width: 5px; height: 5px; background: var(--own); box-shadow: 0 0 0 1.5px var(--panel); z-index: 1; }
.sp.o::before { left: 2px; bottom: 2px; width: 6px; height: 6px; }
.tag.own { color: var(--own); border-color: rgba(127,208,255,.5); }
.tag.hit { color: var(--hit); }
.swatch.hit { box-shadow: 0 0 0 2px var(--hit); }
img.fit { object-fit: contain; }
.desc { font-size: 12.5px; margin-top: 3px; line-height: 1.4; }
.row .desc, .perkrow .desc { font-size: 12px; color: var(--muted); }
.noicon.name { font-size: 9px; text-align: center; }
.sortlbl { margin-left: auto; }
.tag.cost { color: #ffd98a; border-color: rgba(255,217,138,.4); font-family: var(--mono); text-transform: none; letter-spacing: 0; }
/* run tab */
.run h3 { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 16px 0 6px; display: flex; justify-content: space-between; }
.run h3:first-child { margin-top: 2px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; margin: 2px 0 0; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
.facts [title] { cursor: help; }
.run .note { color: var(--muted); font-size: 13px; margin: 0; }
.row.static { cursor: default; }
.row.static:hover { background: none; }
.ic.click { cursor: pointer; }
.shift { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.shift .swatch { margin: 0; }
.swatch.collapsed { background: #5a5363; border-radius: 2px; border-color: #ff8a7a; }
.perklist { display: flex; flex-direction: column; gap: 4px; }
.perkrow { display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: start; font-size: 13px; }
.orbdot { width: 9px; height: 9px; border-radius: 50%; background: #d9a6ff; display: inline-block; }
.perkdot { width: 9px; height: 9px; background: #7fd0ff; display: inline-block; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.empty { color: var(--muted); font-size: 13px; padding: 8px; line-height: 1.5; }
/* spell library */
.lib h3 { font: 600 11px var(--body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 14px 0 6px; display: flex; justify-content: space-between; }
.lib h3:first-child { margin-top: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 4px; }
.sp { position: relative; aspect-ratio: 1; display: grid; place-items: center; background: #0b0a10; border: 1px solid var(--line); border-radius: 5px; cursor: pointer; padding: 0; }
.sp img { width: 26px; height: 26px; image-rendering: pixelated; }
.sp.off img { opacity: .28; filter: grayscale(1); }
.sp.r { border-color: rgba(232,182,76,.6); }
.sp.r::before { content: ""; position: absolute; left: 0; top: 0; border-style: solid; border-width: 9px 9px 0 0; border-color: var(--gold) transparent transparent transparent; border-top-left-radius: 4px; }
.sp:hover { border-color: var(--muted); }
.sp[aria-pressed="true"] { border-color: var(--hit); box-shadow: 0 0 0 1px var(--hit); background: rgba(255,95,210,.12); }
.sp .cnt { position: absolute; right: 1px; bottom: 0; font: 600 9.5px var(--mono); color: var(--fg); text-shadow: 0 0 3px #000, 0 0 2px #000; }
.sp.n::after { content: ""; position: absolute; right: 2px; top: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--new); }
.row.irow { grid-template-columns: 20px 1fr; }
main { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #0a0910; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
canvas.drag { cursor: grabbing; }
.hud { position: absolute; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); font: 12px var(--mono); color: var(--muted); background: rgba(15,13,20,.82); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-variant-numeric: tabular-nums; pointer-events: none; }
.zoom { position: absolute; right: calc(12px + env(safe-area-inset-right, 0px)); top: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 34px; height: 34px; font: 600 18px var(--body); color: var(--fg); background: rgba(23,20,31,.9); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.legend { position: absolute; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; font-size: 12px; color: var(--muted); background: rgba(15,13,20,.82); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.legend { align-items: center; flex-wrap: wrap; max-width: calc(100% - 24px); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.layer { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--body); color: var(--fg); background: none; border: 1px solid var(--line); border-radius: 99px; padding: 3px 9px; cursor: pointer; }
.layer .dot { margin-top: 0; }
.layer[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; opacity: .6; }
.layer:hover { border-color: var(--muted); }
.itemdot { width: 9px; height: 9px; border-radius: 2px; background: #c9a7ff; display: inline-block; }
.flaskdot { width: 9px; height: 9px; border-radius: 50% 50% 45% 45%; background: #6aa9d8; display: inline-block; }
.legend .ndot { width: 8px; height: 8px; border-radius: 50%; background: var(--new); display: inline-block; }
.tip { position: absolute; z-index: 5; width: 310px; max-width: calc(100% - 16px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; box-shadow: 0 8px 28px rgba(0,0,0,.5); pointer-events: none; }
.tip.live { pointer-events: auto; }
.tipnav { display: flex; align-items: center; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
.tipnav .rmeta { margin: 0 auto 0 0; min-width: 0; }
.tipnav .btn { white-space: nowrap; flex: none; }
.tip .rname { font-size: 14px; }
.tip .sec { font: 600 10px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-top: 9px; }
.tip ol { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 3px; }
.tip li { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: center; font-size: 12.5px; }
.tip li.m { color: var(--hit); font-weight: 600; }
.tip li .tags { display: flex; gap: 3px; justify-self: end; }
.toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--new); color: var(--fg); border-radius: 8px; padding: 7px 12px; font-size: 13px; box-shadow: 0 8px 28px rgba(0,0,0,.5); pointer-events: none; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 1fr 52%; }
  main { grid-row: 1; }
  aside { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: 10px; gap: 8px; }
  h1 { font-size: 19px; }
  .legend .key { display: none; }
  .legend { left: 12px; right: auto; bottom: 8px; padding: 4px 6px; gap: 4px; }
  .hud { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="top">
      <h1>Noita Companion</h1>
      <div class="sync">
        <div class="btns" id="live-btns" hidden>
          <button class="btn" id="refresh" title="Rescan the save now">Refresh</button>
          <button class="btn" id="auto" aria-pressed="false" title="Rescan every 10 seconds while you play"><i class="led"></i>Auto</button>
        </div>
        <div class="status" id="status"></div>
      </div>
    </div>
    <div class="tracking">
      <span class="lbl">Tracking</span>
      <div class="tchips" id="tchips"></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-wands" aria-selected="true">Found <span id="n-wands"></span></button>
      <button class="tab" role="tab" id="tab-lib" aria-selected="false">Spells <span id="n-lib"></span></button>
      <button class="tab" role="tab" id="tab-items" aria-selected="false">Items <span id="n-items"></span></button>
      <button class="tab" role="tab" id="tab-mat" aria-selected="false">Materials <span id="n-mat"></span></button>
      <button class="tab" role="tab" id="tab-run" aria-selected="false">Run</button>
    </div>
    <input id="q" type="search" placeholder="Filter by spell name" autocomplete="off" spellcheck="false" aria-label="Filter">
    <div class="controls" id="wand-controls">
      <select id="show" aria-label="Show">
        <option value="wand">Wands</option>
        <option value="card">Loose spells</option>
        <option value="container">Flasks &amp; pouches</option>
        <option value="item">Other items</option>
        <option value="perk">Perks</option>
      </select>
      <button class="chip" id="f-tracked" aria-pressed="false">Has tracked</button>
      <button class="chip rare" id="f-rare" aria-pressed="false">Rare/notable</button>
      <button class="chip" id="f-shop" aria-pressed="false">For sale</button>
      <button class="chip" id="f-owned" aria-pressed="false" title="Hide loose spells you already carry, and wands whose spells you all carry">Hide carried</button>
      <button class="chip new" id="f-new" aria-pressed="false">Has new spells</button>
      <button class="chip" id="f-ns" aria-pressed="false">Non-shuffle</button>
      <button class="chip" id="f-ac" aria-pressed="false">Always casts</button>
      <button class="chip" id="f-unheld" aria-pressed="false">Never held</button>
      <label class="lbl sortlbl" for="sort" data-wand>Sort</label>
      <select id="sort" data-wand>
        <option value="tracked">Tracked first</option>
        <option value="rarity">Rarest spell</option>
        <option value="mana_max">Max mana</option>
        <option value="mana_charge">Mana charge</option>
        <option value="capacity">Capacity</option>
        <option value="per_cast">Spells per cast</option>
        <option value="cast_delay">Cast delay (low)</option>
        <option value="recharge">Recharge (low)</option>
        <option value="spread">Spread (low)</option>
        <option value="cost">Price (low)</option>
      </select>
    </div>
    <div class="controls" id="lib-controls" hidden>
      <button class="chip" id="l-map" aria-pressed="false">On the map</button>
      <button class="chip rare" id="l-rare" aria-pressed="false">Rare/notable</button>
      <button class="chip new" id="l-new" aria-pressed="false">Never picked up</button>
      <button class="chip" id="l-owned" aria-pressed="false">Carried</button>
      <button class="chip" id="l-sort" aria-pressed="false">Rarest first</button>
      <button class="chip" id="l-clear">Clear tracking</button>
    </div>
    <div class="controls" id="item-controls" hidden>
      <button class="chip" id="i-map" aria-pressed="false">On the map</button>
      <button class="chip rare" id="i-rare" aria-pressed="false">Rare</button>
    </div>
    <div class="controls" id="mat-controls" hidden>
      <button class="chip rare" id="m-rare" aria-pressed="true">Rare only</button>
      <button class="chip" id="m-flask" aria-pressed="false">Flask materials</button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="pane" id="pane"></div>
  </aside>
  <main>
    <canvas id="cv" aria-label="World map"></canvas>
    <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit main world">⤢</button></div>
    <div class="hud" id="hud">x —, y —</div>
    <div class="legend" role="group" aria-label="Map layers">
      <button class="layer" id="layer-wand" aria-pressed="true"><i class="dot"></i>Wands</button>
      <button class="layer" id="layer-card" aria-pressed="true"><i class="dot card"></i>Loose spells</button>
      <button class="layer" id="layer-container" aria-pressed="true"><i class="flaskdot"></i>Flasks &amp; pouches</button>
      <button class="layer" id="layer-item" aria-pressed="true" title="Gold nuggets and Holy Mountain fixtures only show when tracked"><i class="itemdot"></i>Items</button>
      <button class="layer" id="layer-perk" aria-pressed="true" title="Includes collapsed Holy Mountains"><i class="perkdot"></i>Perks</button>
      <button class="layer" id="layer-orb" aria-pressed="true" title="Orb locations from the game’s own orb map (main world)"><i class="orbdot"></i>Orbs</button>
      <span class="key"><i class="dot hit"></i>Tracked</span><span class="key"><i class="ndot"></i>Never picked up</span>
    </div>
    <div class="tip" id="tip" hidden></div>
    <div class="toast" id="toast" hidden></div>
  </main>
</div>

<script>
/* Noita Companion page. Data comes from /api/data (live) or is embedded by --export (static snapshot).
   Map coordinates: world pixels (x, y); "image" pixels are world / DIV, which is what tiles and the view use. */
let D = /*DATA*/null;
const LIVE = !D;
const TYPE_NAMES = { 'Projectile': 'Projectiles', 'Static projectile': 'Static projectiles', 'Projectile modifier': 'Projectile modifiers',
                     'Material': 'Materials' };
const SRC = { pedestal: 'item pedestals', lab_pedestal: 'lab pedestals', chest: 'chests', great_chest: 'great chests' };
const COLORS = { bg: '#0a0910', fg: '#e9e4f2', gold: '#e8b64c', card: '#8fa3c8', hit: '#ff5fd2', new: '#6fe0a0', own: '#7fd0ff', item: '#c9a7ff', orb: '#d9a6ff', bad: '#ff8a7a' };

/* ---------- small helpers ---------- */
const $ = id => document.getElementById(id);
const el = (tagName, cls, text) => { const e = document.createElement(tagName); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const tag = (text, cls = '', title) => { const s = el('span', 'tag ' + cls, text); if (title) s.title = title; return s; };
const img = (src, cls) => { const i = el('img', cls); i.src = src; i.alt = ''; return i; };
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v != null ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
const pct = p => (p * 100).toFixed(p >= 0.01 ? 1 : p >= 0.001 ? 2 : 3) + '%';
const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n);
const secs = f => (f / 60).toFixed(2) + 's';
const clock = t => new Date(t * 1000).toLocaleTimeString();
const when = t => t ? new Date(t * 1000).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : 'never';
const worldIndex = x => Math.round(x / (D.world_w || 35840));
// main world first, then outwards; within a world west to east, then top to bottom
const byWorld = (a, b) => Math.abs(worldIndex(a.x)) - Math.abs(worldIndex(b.x)) || a.x - b.x || a.y - b.y;

/* ---------- state ---------- */
const cv = $('cv'), ctx = cv.getContext('2d');
let S = {}, M = {}, C = {}, P = {}, INV = null, RUN = null, DIV = 4;
let items = [], onMap = {}, owned = new Set(), orbRooms = [], collapsedTemples = [];
let tracked = new Set(store.get('tracked', ['MANA_REDUCE']));
let trackedMats = new Set(store.get('trackedMats', []));
let trackedItems = new Set(store.get('trackedItems', ['Kiuaskivi']));
let tab = 'wands', show = 'wand', query = '';
let view = { s: 0.2, x: 0, y: 0 };
let selected = null, hover = null;
let filters = { tracked: false, rare: false, shop: false, owned: false, new: false, ns: false, ac: false, unheld: false };
let lib = { map: false, rare: false, new: false, owned: false, sort: false };
let itemf = { map: false, rare: false };
let matf = { rare: true, flask: false };
let layers = Object.assign({ wand: true, card: true, container: true, item: true, perk: true, orb: true }, store.get('layers', {}));
let staticImg = null;
const tiles = new Map();          // 'cx_cy' -> { cx, cy, v, img, ready, prev }
const spotCache = new Map();      // material -> one stable object per spot, so a spot can stay selected

function ingest(data) {
  D = data; S = D.spells; M = D.materials || {}; C = D.catalog || {}; P = D.perks || {}; DIV = D.div;
  INV = D.inventory || null; RUN = D.run || null;
  owned = new Set(INV ? [...INV.spells, ...INV.wands.flatMap(w => [...w.spells, ...w.always])] : []);
  const marker = (kind, x, y, extra) => ({ marker: kind, x, y, ix: x / DIV, iy: y / DIV, ...extra });
  orbRooms = ((RUN && RUN.orb_rooms) || []).map(([x, y], i) => marker('orb', x, y, { i }));
  collapsedTemples = ((RUN && RUN.temples_collapsed) || []).filter(t => t.x != null).map(t => marker('temple', t.x, t.y));
  const prevSel = selected && selected.key;
  spotCache.clear();
  items = D.items.map((it, i) => ({ ...it, i, ix: it.x / DIV, iy: it.y / DIV, all: [...(it.always || []), ...it.spells],
    key: `${it.kind}:${it.x}:${it.y}:${it.spells.join(',')}${it.perk || ''}` }));
  onMap = {};
  for (const it of items) for (const s of new Set(it.all)) onMap[s] = (onMap[s] || 0) + 1;
  selected = prevSel ? items.find(it => it.key === prevSel) || null : null;
  if (D.live) loadTiles();
  else if (!staticImg) { staticImg = new Image(); staticImg.onload = draw; staticImg.src = 'map.webp'; }
}
function loadTiles() {
  const keep = new Set();
  for (const [cx, cy, v] of D.tiles) {
    const k = cx + '_' + cy; keep.add(k);
    const t = tiles.get(k);
    if (t && t.v === v) continue;
    const im = new Image();
    im.onload = () => { const tt = tiles.get(k); if (tt) tt.ready = true; draw(); };
    im.src = `/tile/${k}.png?v=${v}`;
    tiles.set(k, { cx, cy, v, img: im, ready: false, prev: t && t.ready ? t.img : null });   // keep the old image until the new one loads
  }
  for (const k of [...tiles.keys()]) if (!keep.has(k)) tiles.delete(k);
}

/* ---------- facts about things ---------- */
const isBox = it => it.kind === 'flask' || it.kind === 'pouch';
const kindOf = it => isBox(it) ? 'container' : it.kind;
const cat = it => C[it.item] || {};
const perkOf = it => P[it.perk] || { name: it.name, icon: null, description: '' };
const quiet = it => it.kind === 'item' && cat(it).quiet;          // only drawn when tracked
const name = id => (S[id] && S[id].name) || id;
const isNew = id => !!S[id] && !S[id].known;
const isRare = id => !!S[id] && S[id].rare;
const isOwned = id => owned.has(id);
const matName = k => (M[k] && M[k].ui) || k.replace(/_/g, ' ');
const matColor = k => (M[k] && M[k].color) || '#888';
const hasNew = it => it.all.some(isNew);
const allOwned = it => it.all.length > 0 && it.all.every(isOwned);    // wands with no spells don't count
const rarest = it => Math.min(...it.all.map(s => (S[s] && S[s].odds) || 1), 1);
function hasTracked(it) {
  if (it.kind === 'perk') return false;
  if (it.kind === 'item') return trackedItems.has(it.item);
  if (isBox(it)) return (it.contents || []).some(([m]) => trackedMats.has(m));
  return it.all.some(s => tracked.has(s));
}
function hasRare(it) {
  if (it.kind === 'item') return !!cat(it).rare;
  if (it.kind === 'perk' || isBox(it)) return !!it.notable;
  return it.all.some(isRare);
}
const tierText = t => !t.length ? '' : t.length === 1 ? `tier ${t[0]}` : `tiers ${t[0]}–${t[t.length - 1]}`;
function oddsText(id) {
  const sp = S[id]; if (!sp) return '';
  if (!sp.odds) return 'Not a random spawn' + (sp.notable ? ' · notable' : '');
  return (sp.notable ? 'Notable · ' : '') + `${pct(sp.odds)} per spell roll at ${tierText(sp.tiers)}`;
}

/* ---------- Found tab filters ----------
   Each filter applies to some kinds only; its chip is hidden for the others and it doesn't filter them. */
const SPELL_KINDS = ['wand', 'card'];
const FILTERS = {
  tracked: { kinds: ['wand', 'card', 'container', 'item'], test: hasTracked },
  rare:    { kinds: ['wand', 'card', 'container', 'item', 'perk'], test: hasRare },
  shop:    { kinds: ['wand', 'card', 'item'], test: it => it.cost != null },
  owned:   { kinds: SPELL_KINDS, test: it => !allOwned(it), needsInventory: true },
  new:     { kinds: SPELL_KINDS, test: hasNew },
  ns:      { kinds: ['wand'], test: it => it.shuffle === false },
  ac:      { kinds: ['wand'], test: it => (it.always || []).length > 0 },
  unheld:  { kinds: ['wand'], test: it => !it.picked },
};
const filterOn = k => filters[k] && FILTERS[k].kinds.includes(show);
function textMatch(it, t) {
  if (!t) return true;
  const id = t.replace(/ /g, '_');
  if (isBox(it)) return (it.contents || []).some(([m]) => matName(m).toLowerCase().includes(t) || m.includes(id));
  if (it.kind === 'item') return it.item.toLowerCase().includes(t);
  if (it.kind === 'perk') return it.name.toLowerCase().includes(t) || (perkOf(it).description || '').toLowerCase().includes(t);
  return it.all.some(s => name(s).toLowerCase().includes(t) || s.toLowerCase().includes(id)) || (it.name || '').toLowerCase().includes(t);
}
const matches = it => Object.keys(FILTERS).every(k => !filterOn(k) || FILTERS[k].test(it)) && textMatch(it, tab === 'wands' ? query : '');
const passes = it => kindOf(it) === show && matches(it);                      // shown in the list
const filtering = () => tab === 'wands' && (Object.keys(FILTERS).some(filterOn) || !!query);
// on the map, filters dim non-matching things of the kind being listed; other kinds are left alone
const dimmed = (it, active) => active && kindOf(it) === show && !matches(it);
const onLayer = it => layers[kindOf(it)];

/* ---------- map ---------- */
function bounds() {      // main world only, for fitting the view
  const half = (D.world_w || 35840) / 2;
  if (!D.live) { const im = D.image; return [im.x / DIV, im.y / DIV, im.x / DIV + im.w, im.y / DIV + im.h]; }
  const ts = D.tiles.filter(t => t[0] >= -half && t[0] < half), xs = ts.map(t => t[0]), ys = ts.map(t => t[1]);
  return [Math.min(...xs) / DIV, Math.min(...ys) / DIV, (Math.max(...xs) + 512) / DIV, (Math.max(...ys) + 512) / DIV];
}
// A fit or move asked for before the map has a size (hidden window, first layout) runs once it has one; the last one wins.
let pendingView = null;
function laidOut(retry) {
  const r = cv.getBoundingClientRect();
  if (r.width && r.height) { pendingView = null; return r; }
  pendingView = retry; return null;
}
function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (pendingView && r.width && r.height) pendingView(); else draw();
}
function fit() {
  const r = laidOut(fit); if (!r) return;
  const [x0, y0, x1, y1] = bounds();
  const s = Math.min(r.width / (x1 - x0), r.height / (y1 - y0)) * 0.98;
  view = { s, x: (x0 + x1) / 2 - r.width / 2 / s, y: (y0 + y1) / 2 - r.height / 2 / s }; draw();
}
function flyTo(ix, iy, scale) {
  const r = laidOut(() => flyTo(ix, iy, scale)); if (!r) return;
  const s = scale || Math.max(view.s, 1.5);
  view = { s, x: ix - r.width / 2 / s, y: iy - r.height / 2 / s }; draw();
}
const toScreen = (ix, iy) => [(ix - view.x) * view.s, (iy - view.y) * view.s];

const iconImgs = new Map();
function urlImg(url) {
  if (!url) return null;
  let im = iconImgs.get(url);
  if (!im) { im = new Image(); im.onload = draw; im.src = url; iconImgs.set(url, im); }
  return im.complete && im.naturalWidth ? im : null;
}
const itemImg = it => urlImg(it.kind === 'perk' ? perkOf(it).icon : cat(it).icon);

/* full-detail tiles: past 1x zoom, visible chunks are fetched at 1 world pixel per pixel (drawn by the app on first
   request, then cached). Quarter tiles stay underneath until each one arrives. */
const FULL_AT = 1, FULL_MAX = 96, full = new Map();   // 'cx_cy_v' -> { img, ready, used }
let fullUse = 0;
function fullTile(t) {
  const k = `${t.cx}_${t.cy}_${t.v}`;
  let f = full.get(k);
  if (!f) {
    f = { img: new Image(), ready: false, used: 0 };
    f.img.onload = () => { f.ready = true; draw(); };
    f.img.src = `/tile/full/${t.cx}_${t.cy}.png?v=${t.v}`;
    full.set(k, f);
    if (full.size > FULL_MAX) {   // forget the least recently drawn
      const old = [...full.entries()].sort((a, b) => a[1].used - b[1].used).slice(0, full.size - FULL_MAX);
      for (const [ok, of] of old) { of.img.src = ''; full.delete(ok); }
    }
  }
  f.used = ++fullUse;
  return f.ready ? f.img : null;
}

const ring = (sx, sy, r, color, width = 2) => { ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.stroke(); };
const diamond = (sx, sy, r) => { ctx.moveTo(sx, sy - r); ctx.lineTo(sx + r, sy); ctx.lineTo(sx, sy + r); ctx.lineTo(sx - r, sy); ctx.closePath(); };

function drawTiles(r) {
  if (!D.live) {
    if (staticImg && staticImg.complete && staticImg.naturalWidth) {
      const [sx, sy] = toScreen(D.image.x / DIV, D.image.y / DIV);
      ctx.drawImage(staticImg, sx, sy, D.image.w * view.s, D.image.h * view.s);
    }
    return;
  }
  const sz = D.tile * view.s + 0.5, detail = view.s > FULL_AT;
  const pad = detail ? sz : 0;    // with full detail, also fetch one ring of chunks outside the view, for panning
  for (const t of tiles.values()) {
    const [sx, sy] = toScreen(t.cx / DIV, t.cy / DIV);
    if (sx > r.width + pad || sy > r.height + pad || sx + sz < -pad || sy + sz < -pad) continue;
    const fim = detail && t.ready ? fullTile(t) : null;
    if (sx > r.width || sy > r.height || sx + sz < 0 || sy + sz < 0) continue;
    const im = fim || (t.ready ? t.img : t.prev);
    ctx.imageSmoothingEnabled = fim ? view.s < DIV : view.s < 1;   // smooth only while shrinking
    if (im) ctx.drawImage(im, sx, sy, sz, sz);

function drawSpots(r) {   // tracked materials: every area they appear in
  for (const k of trackedMats) {
    const m = M[k]; if (!m) continue;
    for (const sp of spotsOf(k)) {
      const [sx, sy] = toScreen(sp.ix, sp.iy);
      if (sx < -20 || sy < -20 || sx > r.width + 20 || sy > r.height + 20) continue;
      const rad = Math.min(18, 6 + Math.sqrt(sp.n) / 4);
      ctx.fillStyle = m.color; ctx.globalAlpha = 0.95; ctx.beginPath(); ctx.arc(sx, sy, rad, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1; ctx.strokeStyle = COLORS.bg; ctx.lineWidth = 2; ctx.stroke();

}
function drawMarkers(r) {   // orb-map locations and collapsed Holy Mountains
  const visible = (sx, sy) => isFinite(sx) && isFinite(sy) && sx > -40 && sy > -40 && sx < r.width + 40 && sy < r.height + 40;
  if (layers.orb) for (const o of orbRooms) {
    const [sx, sy] = toScreen(o.ix, o.iy); if (!visible(sx, sy)) continue;
    ctx.fillStyle = COLORS.orb; ctx.strokeStyle = COLORS.bg; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(sx, sy, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (o === selected || o === hover) ring(sx, sy, 12, COLORS.fg);
  }

    const [sx, sy] = toScreen(t.ix, t.iy); if (!visible(sx, sy)) continue;
    ctx.fillStyle = '#5a5363'; ctx.strokeStyle = COLORS.bg; ctx.lineWidth = 1.5;
    ctx.fillRect(sx - 8, sy - 8, 16, 16); ctx.strokeRect(sx - 8, sy - 8, 16, 16);
    ctx.strokeStyle = COLORS.bad; ctx.lineWidth = 2.5; ctx.beginPath();
    ctx.moveTo(sx - 5, sy - 5); ctx.lineTo(sx + 5, sy + 5); ctx.moveTo(sx + 5, sy - 5); ctx.lineTo(sx - 5, sy + 5); ctx.stroke();

function drawIconMarker(it, sx, sy, z, m, sel, faded) {   // items and perks: their icon, with rings for rare / tracked / selected

  else { ctx.fillStyle = COLORS.item; ctx.strokeStyle = COLORS.bg; ctx.lineWidth = 1.5; ctx.fillRect(sx - 4, sy - 4, 8, 8); ctx.strokeRect(sx - 4, sy - 4, 8, 8); }
  if (hasRare(it)) ring(sx, sy, z / 2 + 4, COLORS.gold);

function drawItems(r) {
  const active = filtering();
  // tracked and selected things are drawn last, on top
  const order = [...items].sort((a, b) => (hasTracked(a) - hasTracked(b)) || ((a === selected) - (b === selected)));
  for (const it of order) {
    const [sx, sy] = toScreen(it.ix, it.iy);
    if (sx < -20 || sy < -20 || sx > r.width + 20 || sy > r.height + 20) continue;
    if (it !== selected && (!onLayer(it) || (quiet(it) && !hasTracked(it)))) continue;
    const m = hasTracked(it), sel = it === selected || it === hover, dim = dimmed(it, active);
    if (it.kind === 'perk') { drawIconMarker(it, sx, sy, 16, false, sel, dim); continue; }
    if (it.kind === 'item') { drawIconMarker(it, sx, sy, m ? 18 : 13, m, sel, dim && !m); continue; }
    if (dim && !m && it.kind === 'card') continue;
    ctx.globalAlpha = dim && !m ? 0.22 : 1;
    const box = isBox(it);
    const sz = it.kind === 'wand' ? (m ? 7 : 4.5) : box ? (m || it.notable ? 6 : 4) : (m ? 6 : 3);
    ctx.fillStyle = box ? (it.main ? matColor(it.main) : '#555') : m ? COLORS.hit : it.kind === 'wand' ? COLORS.gold : COLORS.card;
    ctx.strokeStyle = COLORS.bg; ctx.lineWidth = 1.5;
    ctx.beginPath();
    if (it.kind === 'wand') diamond(sx, sy, sz);
    else if (it.kind === 'flask') { ctx.arc(sx, sy + sz * 0.25, sz, 0, Math.PI * 2); ctx.rect(sx - sz * 0.35, sy - sz * 1.3, sz * 0.7, sz * 0.9); }   // body and neck
    else if (it.kind === 'pouch') ctx.roundRect ? ctx.roundRect(sx - sz, sy - sz, sz * 2, sz * 2, 2) : ctx.rect(sx - sz, sy - sz, sz * 2, sz * 2);
    else ctx.arc(sx, sy, sz, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

      if (!box && hasNew(it)) { ctx.fillStyle = COLORS.new; ctx.beginPath(); ctx.arc(sx + sz * 0.9, sy - sz * 0.9, 2.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }

  ctx.imageSmoothingEnabled = view.s < 1;

  drawMarkers(r);

/* ---------- shared row and tooltip pieces ---------- */
function title(it) { return it.kind === 'wand' ? (it.name || 'Wand') : it.kind === 'card' ? name(it.spells[0]) : it.name; }
function spellIcon(id) {
  const w = el('span', 'ic' + (isNew(id) ? ' n' : '') + (isRare(id) ? ' r' : '') + (tracked.has(id) ? ' m' : '') + (isOwned(id) ? ' o' : ''));
  w.title = [name(id), isRare(id) && 'rare/notable', isNew(id) && 'never picked up', isOwned(id) && 'carried'].filter(Boolean).join(' · ');
  const sp = S[id];

  return w;
}
function spellIcons(ids, label) {
  const row = el('div', 'icons');
  if (label) row.append(el('span', 'ac', label));
  ids.forEach(s => row.append(spellIcon(s)));
  return row;
}
function iconBox(src, size, fallbackText) {   // item and perk icons in rows
  const w = el('span', 'ic'); w.style.width = w.style.height = size + 'px';
  if (src) { const i = img(src, 'fit'); i.style.width = i.style.height = (size - 3) + 'px'; w.append(i); }
  else w.append(el('span', 'noicon', fallbackText));

}
function itemOdds(c) {

}
function boxOdds(it) {
  if (!it.main) return 'Empty';
  if (it.odds != null) return `${pct(it.odds)} of ${it.kind === 'pouch' ? 'pouches' : 'regular flasks'}`;
  return it.why || '';
}
function statsEl(it) {
  const g = el('div', 'stats');
  for (const [k, v] of [['Cast', it.per_cast], ['Delay', secs(it.cast_delay)], ['Rech', secs(it.recharge)], ['Cap', it.capacity],
                        ['Mana', it.mana_max], ['Chg', it.mana_charge], ['Sprd', it.spread + '°']]) {
    const s = el('span'); s.append(el('i', '', k), String(v)); g.append(s);
  }

}
function headTags(it) {

  if (it.kind === 'perk') {

    const n = RUN && RUN.perks && RUN.perks[it.perk];
    if (n) f.append(tag(n > 1 ? `Picked ×${n}` : 'Picked', 'own'));
  } else if (isBox(it)) {
    if (it.notable) f.append(tag(it.odds != null ? 'Rare' : 'Unusual', 'rare'));
    if (it.unverified) f.append(tag('Unverified', '', 'This contents number could not be checked against the spawn tables'));
    if (it.fill && it.fill !== 1000) f.append(tag(Math.round(it.fill / 10) + '% full'));

    if (nr) f.append(tag(it.kind === 'card' ? 'Rare/notable' : nr === 1 ? 'Rare/notable spell' : `${nr} rare/notable`, 'rare'));
    if (it.kind === 'wand' && it.shuffle === false) f.append(tag('Non-shuffle', 'ns'));

    if (n) f.append(tag(it.kind === 'card' ? 'New' : n === 1 ? '1 new' : `${n} new`, 'new'));

function empty(parent, text) { parent.append(el('div', 'empty', text)); }
function groupHead(label, count) { const h = el('h3'); h.append(el('span', '', label), el('span', '', count ?? '')); return h; }

/* ---------- Found tab ---------- */
const LIST_MAX = 300;
const SORTS = {   // per kind; wands use the Sort menu

/* ---------- tracking ---------- */
function afterToggle() { const scroll = $('pane').scrollTop; render(); $('pane').scrollTop = scroll; }
function toggleTrack(id) {

  store.set('tracked', [...tracked]); afterToggle();
  if (!tracked.has(id)) return;
  const hits = items.filter(it => it.all.includes(id));

}
function toggleItem(k) {
  trackedItems.has(k) ? trackedItems.delete(k) : trackedItems.add(k);
  store.set('trackedItems', [...trackedItems]); afterToggle();
  if (!trackedItems.has(k)) return;
  const hits = items.filter(it => it.kind === 'item' && it.item === k);
  if (hits.length) goTo(hits[0]);
  toast(hits.length ? `${hits.length} × ${k} in the loaded world` : `No ${k} in the loaded world yet`);
}
function toggleMat(k) {
  trackedMats.has(k) ? trackedMats.delete(k) : trackedMats.add(k);

  const m = M[k];
  if (!trackedMats.has(k) || !m) return;

  else if (m.spots.length) { const [x, y] = m.spots[0]; flyTo(x / DIV, y / DIV, Math.max(view.s, 0.8)); }

function renderTracking() {
  const box = $('tchips'); box.textContent = '';

  for (const k of trackedItems) { const c = C[k] || { name: k, n: 0 }; chip(c.name, c.n || 0, c.icon ? img(c.icon, 'fit') : null, () => toggleItem(k)); }

/* ---------- tooltip ---------- */
function spotsOf(k) {
  if (!spotCache.has(k)) {
    const m = M[k];
    spotCache.set(k, m ? m.spots.map(([x, y, n]) => ({ spot: true, k, m, x, y, n, ix: x / DIV, iy: y / DIV })) : []);
  }
  return spotCache.get(k);
}
// What "Show next" steps through from `it`:
//   material spot: every area with that material, plus every flask or pouch holding it
//   orb / collapsed mountain: all of that kind
//   item or perk: every copy
//   wand / loose spell: everything holding one of the tracked spells it holds
//   flask / pouch: everything holding one of its tracked materials (and those materials' spots),
//                  or failing that, every container with the same main material
function siblings(it) {
  if (it.spot) return { list: [...spotsOf(it.k), ...items.filter(o => isBox(o) && (o.contents || []).some(([m]) => m === it.k))].sort(byWorld), what: it.m.ui };
  if (it.marker === 'orb') return { list: orbRooms, what: '' };
  if (it.marker === 'temple') return { list: collapsedTemples, what: '' };
  let match = null, what = '', extra = [];
  if (it.kind === 'perk') { match = o => o.kind === 'perk' && o.perk === it.perk; what = it.name; }
  else if (it.kind === 'item') { match = o => o.kind === 'item' && o.item === it.item; }
  else if (isBox(it)) {
    const mine = (it.contents || []).map(([m]) => m).filter(m => trackedMats.has(m));
    if (mine.length) { match = o => isBox(o) && (o.contents || []).some(([m]) => mine.includes(m)); what = mine.map(matName).join(', '); extra = mine.flatMap(spotsOf); }
    else if (it.main) { match = o => isBox(o) && o.main === it.main; what = matName(it.main); }
  } else {
    const mine = [...new Set(it.all.filter(s => tracked.has(s)))];
    if (mine.length) { match = o => SPELL_KINDS.includes(o.kind) && o.all.some(s => mine.includes(s)); what = mine.map(name).join(', '); }
  }
  return match ? { list: [...items.filter(match), ...extra].sort(byWorld), what } : { list: [], what: '' };
}
function goTo(it) {
  selected = it; flyTo(it.ix, it.iy, Math.max(view.s, 1)); showTip(it);
  if (tab === 'wands') renderFound();
}
function tipBody(tip, it) {
  const meta = text => tip.append(el('div', 'rmeta', text));
  const section = label => tip.append(el('div', 'sec', label));
  if (it.marker === 'temple') { tip.append(rowHead('Collapsed Holy Mountain')); return meta(`Its perks and shop items are still in the save. x ${it.x}, y ${it.y}`); }
  if (it.marker === 'orb') { tip.append(rowHead('Orb location')); return meta(`From the game’s orb map, which doesn’t say which orb is here or whether it’s taken. x ${it.x}, y ${it.y}`); }
  if (it.spot) { tip.append(rowHead(it.m.ui)); return meta(`${fmtN(it.n)} px in this area · x ${it.x}, y ${it.y}`); }
  tip.append(rowHead(title(it), headTags(it)));
  if (it.kind === 'perk' && perkOf(it).description) tip.append(el('div', 'desc', perkOf(it).description));
  if (it.kind === 'item') {
    const c = cat(it);
    if (itemOdds(c)) meta(itemOdds(c));
    for (const [label, text] of [['Description', c.description], ['Effect', c.effect]]) if (text) { section(label); tip.append(el('div', 'desc', text)); }
  }
  meta(`x ${it.x}, y ${it.y}${it.kind === 'card' ? ' · loose spell' : ''}${it.kind === 'perk' ? ' · perk' : ''}${it.cost != null ? ` · ${it.cost} gold` : ''}`);
  if (isBox(it)) {
    meta(boxOdds(it)); section('Contents');
    const ol = el('ol');
    for (const [m, n] of (it.contents || []).slice(0, 8)) {
      const li = el('li', trackedMats.has(m) ? 'm' : ''), sw = el('span', 'swatch'); sw.style.background = matColor(m);
      li.append(sw, el('span', '', matName(m)), el('span', 'rmeta', `${Math.round(n / 10)}%`)); ol.append(li);
    }
    tip.append(ol);
  }
  const spells = (label, ids) => {
    if (!ids.length) return;
    section(label);
    const ol = el('ol');
    for (const id of ids) {
      const li = el('li', tracked.has(id) ? 'm' : ''), n = el('span', '', name(id)), tg = el('span', 'tags');
      n.title = oddsText(id);
      if (isRare(id)) tg.append(tag(S[id].notable ? 'Notable' : pct(S[id].odds), 'rare'));
      if (isNew(id)) tg.append(tag('New', 'new'));
      if (isOwned(id)) tg.append(tag('Carried', 'own'));
      li.append(spellIcon(id), n, tg); ol.append(li);
    }
    tip.append(ol);
  };
  if (it.kind === 'wand') {
    tip.append(statsEl(it));
    spells('Always casts', it.always || []);
    spells('Spells', it.spells);
    if (!it.all.length) section('No spells');
  } else if (it.kind === 'card') {
    spells('Spell', it.spells);
    meta(oddsText(it.spells[0]));
  }
}
function showTip(it) {
  const tip = $('tip');
  if (!it) { tip.hidden = true; return; }
  tip.textContent = '';
  tipBody(tip, it);
  // "Show next" through the group, only on the selected marker (so the buttons can be clicked)
  const { list, what } = siblings(it);
  const nav = it === selected && list.length > 1;
  tip.classList.toggle('live', nav);
  if (nav) {
    const i = list.indexOf(it);
    const bar = el('div', 'tipnav'), pos = el('span', 'rmeta', `${i + 1} of ${list.length}`);
    if (what && it.kind !== 'item') { pos.title = 'Stepping through everything with ' + what; pos.textContent += ' · ' + (what.length > 22 ? what.slice(0, 21) + '…' : what); }
    const prev = el('button', 'btn', '‹ Previous'); prev.onclick = () => goTo(list[(i - 1 + list.length) % list.length]);
    const next = el('button', 'btn', 'Show next ›'); next.onclick = () => goTo(list[(i + 1) % list.length]);
    bar.append(pos, prev, next); tip.append(bar);
  }
  tip.hidden = false;
  const r = cv.getBoundingClientRect();
  let [sx, sy] = toScreen(it.ix, it.iy); sx += 16; sy += 16;
  if (sx + tip.offsetWidth > r.width - 8) sx -= tip.offsetWidth + 32;
  if (sy + tip.offsetHeight > r.height - 8) sy = r.height - tip.offsetHeight - 8;
  tip.style.left = Math.max(8, sx) + 'px'; tip.style.top = Math.max(8, sy) + 'px';
}

/* ---------- picking, pan and zoom ---------- */
function pick(px, py) {
  let best = null, bd = 14 * 14;
  const dist = o => { const [sx, sy] = toScreen(o.ix, o.iy); return (sx - px) ** 2 + (sy - py) ** 2; };
  const active = filtering();
  for (const it of items) {
    if (!onLayer(it) || (quiet(it) && !hasTracked(it))) continue;
    if (it.kind === 'card' && dimmed(it, active) && !hasTracked(it)) continue;   // hidden, not just dimmed
    const d = dist(it);
    if (d < bd || (best && d <= bd + 40 && hasTracked(it) && !hasTracked(best))) { bd = d; best = it; }   // tracked wins near-ties
  }
  // markers and tracked-material spots win when they are closer than any item
  const others = [...(layers.orb ? orbRooms : []), ...(layers.perk ? collapsedTemples : []), ...[...trackedMats].flatMap(spotsOf)];
  for (const o of others) { const d = dist(o); if (d < bd) { bd = d; best = o; } }
  return best;
}
const samePlace = (a, b) => a === b || (!!a && !!b && !a.kind && !b.kind && a.x === b.x && a.y === b.y);   // spots and markers are rebuilt on refresh
const ptrs = new Map(); let pinch = null, moved = false;
function zoomAt(px, py, f) {
  const ns = Math.min(16, Math.max(0.02, view.s * f));
  const ix = view.x + px / view.s, iy = view.y + py / view.s;
  view = { s: ns, x: ix - px / ns, y: iy - py / ns }; draw();
  if (selected) showTip(selected);
}
cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false; cv.classList.add('drag');
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) }; }
});
cv.addEventListener('pointermove', e => {
  if (!D) return;
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const p = ptrs.get(e.pointerId);
  if (p) {
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    p.x = e.clientX; p.y = e.clientY;
    if (ptrs.size === 2 && pinch) {
      const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
      zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, d / pinch.d); pinch.d = d;
    } else if (ptrs.size === 1) { view.x -= dx / view.s; view.y -= dy / view.s; draw(); if (selected) showTip(selected); }
  } else {
    const h = pick(px, py);
    if (!samePlace(h, hover)) { hover = h; draw(); showTip(hover || selected); cv.style.cursor = h ? 'pointer' : ''; }
  }
  $('hud').textContent = `x ${Math.round((view.x + px / view.s) * DIV)}, y ${Math.round((view.y + py / view.s) * DIV)}`;
});
cv.addEventListener('pointerup', e => {
  const r = cv.getBoundingClientRect();
  if (ptrs.size === 1 && !moved) { selected = pick(e.clientX - r.left, e.clientY - r.top); showTip(selected); if (tab === 'wands') renderFound(); draw(); }
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) cv.classList.remove('drag');
});
cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); pinch = null; });
cv.addEventListener('pointerleave', () => { if (hover) { hover = null; draw(); showTip(selected); } });
const zoomCentre = f => { const r = cv.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, f); };
$('zin').onclick = () => zoomCentre(1.6);
$('zout').onclick = () => zoomCentre(1 / 1.6);
$('zfit').onclick = fit;

/* ---------- live refresh ---------- */
let autoTimer = null, busy = false;
const OFFLINE = 'Can’t reach the app. Restart it, then reload.';
function setStatus(text, err) { const s = $('status'); s.textContent = text; s.classList.toggle('err', !!err); }
function toast(text) { const t = $('toast'); t.textContent = text; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3500); }
function announce(fresh) {   // after a rescan: say if anything tracked or rare appeared
  const nTracked = fresh.filter(hasTracked).length;
  const nRare = fresh.filter(i => SPELL_KINDS.includes(i.kind) && hasRare(i)).length;
  const nBox = fresh.filter(i => isBox(i) && i.notable).length;
  const nItem = fresh.filter(i => i.kind === 'item' && hasRare(i)).length;
  const parts = [nTracked && `${nTracked} new tracked item${nTracked > 1 ? 's' : ''}`, nRare && `${nRare} with rare/notable spells`,
                 nBox && `${nBox} rare or unusual flask${nBox > 1 ? 's' : ''}`, nItem && `${nItem} rare item${nItem > 1 ? 's' : ''}`].filter(Boolean);
  if (parts.length) toast(parts.join(' · '));
}
async function refresh(manual) {
  if (busy) return; busy = true; $('refresh').classList.add('busy');
  if (manual) setStatus('Scanning…');
  try {
    const before = D ? D.version : -1;
    const r = await fetch('/api/refresh', { method: 'POST' });
    const last = await r.json();
    if (!r.ok) throw new Error(last.error || r.status);
    if (last.version !== before) {
      const oldKeys = new Set(items.map(i => i.key));
      ingest(await (await fetch('/api/data')).json());
      if (before >= 0) announce(items.filter(i => !oldKeys.has(i.key)));
      render();
    }
    setStatus(`Scanned ${clock(last.time)} · ${plural(last.chunks, 'area')}, ${plural(last.entity_files, 'item file')} changed`);
  } catch (e) {
    setStatus(OFFLINE, true);
  } finally { busy = false; $('refresh').classList.remove('busy'); }
}
function setAuto(on) {
  $('auto').setAttribute('aria-pressed', on); store.set('auto', on);
  clearInterval(autoTimer); autoTimer = on ? setInterval(() => refresh(false), 10000) : null;
}

/* ---------- controls ---------- */
$('q').addEventListener('input', () => { query = $('q').value.trim().toLowerCase(); render(); });
$('sort').addEventListener('change', render);
$('show').addEventListener('change', e => { show = e.target.value; $('pane').scrollTop = 0; render(); });
for (const k of Object.keys(layers)) {
  const b = $('layer-' + k); b.setAttribute('aria-pressed', layers[k]);
  b.onclick = () => {
    layers[k] = !layers[k]; b.setAttribute('aria-pressed', layers[k]); store.set('layers', layers);
    if (hover && (hover.marker ? (hover.marker === 'orb' ? 'orb' : 'perk') : kindOf(hover)) === k) hover = null;
    draw();
  };
}
const chips = (prefix, state) => { for (const k of Object.keys(state)) $(prefix + k).onclick = e => { state[k] = !state[k]; e.currentTarget.setAttribute('aria-pressed', state[k]); render(); }; };
chips('f-', filters); chips('l-', lib); chips('i-', itemf); chips('m-', matf);
$('l-clear').onclick = () => { tracked.clear(); store.set('tracked', []); render(); };
const TABS = { 'tab-wands': 'wands', 'tab-lib': 'lib', 'tab-items': 'items', 'tab-mat': 'mat', 'tab-run': 'run' };
for (const [id, t] of Object.entries(TABS)) $(id).onclick = () => {
  tab = t; for (const id2 of Object.keys(TABS)) $(id2).setAttribute('aria-selected', id2 === id);
  $('q').value = ''; query = ''; $('pane').scrollTop = 0; render();
};
$('refresh').onclick = () => refresh(true);
$('auto').onclick = () => setAuto($('auto').getAttribute('aria-pressed') !== 'true');

async function start() {
  if (LIVE) {
    $('live-btns').hidden = false; setStatus('Loading…');
    for (;;) {    // the app answers 503 while it loads game data and runs the first scan
      let r;
      try { r = await fetch('/api/data'); }
      catch { setStatus(OFFLINE, true); return; }
      if (r.ok) { ingest(await r.json()); break; }
      const st = await r.json().catch(() => ({}));
      $('summary').textContent = st.error || st.status || 'Starting…';
      setStatus(st.error ? 'Could not start' : 'Scanning…', !!st.error);
      if (st.error) return;
      await new Promise(res => setTimeout(res, 1500));
    }
    if (D.last && D.last.time) setStatus(`Scanned ${clock(D.last.time)}`);
    setAuto(store.get('auto', false));
  } else {
    ingest(D);
    setStatus(`Snapshot from ${D.snapshot}. Run the companion app for live refresh.`);
  }
  new ResizeObserver(resize).observe(cv);
  resize(); fit(); render();
  const first = items.find(it => it.kind === 'wand' && hasTracked(it));
  if (first) { selected = first; flyTo(first.ix, first.iy, 1.2); render(); }
}
start();
</script>
